<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настрой дня</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fdf6f0 0%, #f2e6ef 100%);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #4a3f3a;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 44px;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 10px 40px rgba(120, 90, 60, 0.12);
    }
    svg { margin-bottom: 16px; }
    p { font-size: 19px; line-height: 1.7; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <svg width="90" height="90" viewBox="0 0 100 100" fill="none">
      <path d="M50 88 C 48 66, 46 52, 50 34" stroke="#8aa87a" stroke-width="3" stroke-linecap="round"/>
      <path d="M50 60 C 40 56, 32 58, 26 50" stroke="#8aa87a" stroke-width="3" stroke-linecap="round"/>
      <path d="M50 48 C 60 44, 68 46, 74 38" stroke="#8aa87a" stroke-width="3" stroke-linecap="round"/>
      <g>
        <circle cx="50" cy="26" r="6" fill="#f2b134"/>
        <ellipse cx="50" cy="12" rx="5" ry="9" fill="#e98ba0"/>
        <ellipse cx="50" cy="40" rx="5" ry="9" fill="#e98ba0"/>
        <ellipse cx="36" cy="26" rx="9" ry="5" fill="#e98ba0"/>
        <ellipse cx="64" cy="26" rx="9" ry="5" fill="#e98ba0"/>
        <ellipse cx="40" cy="16" rx="7" ry="5" fill="#f2a5b5" transform="rotate(-45 40 16)"/>
        <ellipse cx="60" cy="16" rx="7" ry="5" fill="#f2a5b5" transform="rotate(45 60 16)"/>
        <ellipse cx="40" cy="36" rx="7" ry="5" fill="#f2a5b5" transform="rotate(45 40 36)"/>
        <ellipse cx="60" cy="36" rx="7" ry="5" fill="#f2a5b5" transform="rotate(-45 60 36)"/>
      </g>
    </svg>
    <p id="phrase"></p>
  </div>

  <script>
    const tips = [
      "Начни день с одного вопроса: «Что сегодня сделает меня чуть лучше?» Не для других — для себя.",
      "Если что-то не нравится — скажи прямо и спокойно. Люди слышат, когда им не кричат.",
      "Сделал ошибку — признай. Это не слабость. Это уважение к себе и другим.",
      "Полистай ленту и заметь: сколько там реальной жизни, а сколько витрины? Не сравнивай себя с витриной.",
      "Твоя ценность — не в том, что у тебя есть. Она в том, как ты поступаешь.",
      "Скажи кому-то спасибо сегодня. Просто так. Это меняет день — и его, и твой.",
      "Хочешь что-то сказать резко? Пауза 10 секунд. Иногда этого хватает.",
      "Движение — лучший антистресс. 10 минут прогулки без телефона. Попробуй.",
      "Сделай одно маленькое дело, которое откладывал. Не всё — одно. Это уже победа.",
      "Умение сказать «нет» — это не грубость. Это границы. Их уважают.",
      "Почитай 5 страниц чего-то, что тебе интересно. Не для школы — для себя.",
      "Злость — нормально. Но решать на горячую голову — плохо. Выдохни, потом действуй.",
      "Заметь, кто рядом. Иногда человеку нужно просто, чтобы его выслушали. Ты можешь это дать.",
      "Наведи порядок в одном маленьком месте. Порядок вокруг — порядок в голове.",
      "Сон — это топливо. Ляг чуть раньше — увидишь разницу.",
      "Перед покупкой спроси: «Мне это нужно или я хочу быть как кто-то?» Честный ответ экономит нервы.",
      "Если чувствуешь, что тебя используют — скажи об этом. Молчание не решает.",
      "Не всё идёт по плану. И это нормально. План — это ориентир, а не приговор.",
      "Помоги кому-то без выгоды. Это учит чувствовать себя сильным по-настоящему.",
      "Запиши одну вещь, за которую ты себе благодарен сегодня. Даже маленькую.",
      "Не всё, что делают другие, — правильно. Думай своей головой. Это твоя суперсила.",
      "Слабость — не в том, чтобы упасть. Слабость — не вставать. Ты можешь встать.",
      "Послушай музыку без телефона в руках. Просто музыку. Это перезагрузка.",
      "Извинись, если был неправ. Не «извини, но...», а просто «извини». Это сильный ход.",
      "Эмоции приходят волнами. Не принимай решения на пике волны. Подожди, пока спадёт.",
      "Большая задача — это много маленьких. Начни с одной части. Не с целого.",
      "Ты не обязан быть как все. Быть собой — это навык. Тренируй его.",
      "Спроси себя: «Что я могу контролировать?» Делай это. Остальное — отпусти.",
      "Даже плохой день — это день. Он пройдёт. Ты — останешься. Береги себя.",
      "Ты уже сделал 30 шагов. Это не мало. Признай это. И продолжай — уже без списка."
    ];

    const d = new Date();
    const start = new Date(d.getFullYear(), 0, 1);
    const dayOfYear = Math.floor((d - start) / (1000 * 60 * 60 * 24)) + 1;

    const i = (dayOfYear - 1) % tips.length;
    document.getElementById('phrase').textContent = tips[i];
  </script>
</body>
</html>

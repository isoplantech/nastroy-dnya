<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Настрой на день</title>
<style>
  body {
    margin: 0; min-height: 100vh;
    background: #111; color: #f5f0e8;
    font-family: Georgia, 'Times New Roman', serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .small { font-size: 14px; opacity: .6; letter-spacing: .1em; text-transform: uppercase; }
  .phrase { font-size: 28px; line-height: 1.4; margin: 24px 0; max-width: 480px; }
  .btn {
    margin-top: 16px; padding: 12px 28px; border: 1px solid #f5f0e8;
    border-radius: 30px; background: none; color: #f5f0e8;
    font-size: 16px; cursor: pointer;
  }
  .btn:active { background: #f5f0e8; color: #111; }
  .date { margin-top: 32px; font-size: 13px; opacity: .5; }
</style>
</head>
<body>
  <div class="small">Настрой на день</div>
  <div class="phrase" id="phrase">…</div>
  <button class="btn" onclick="this.textContent='Принято ✶'">Это про меня</button>
  <div class="date" id="date"></div>
<script>
  const messages = [
    "Сегодня достаточно быть просто живым. Остальное — лишнее.",
    "Начни с маленького шага. Он важнее большого плана.",
    "Ты не опоздал. Ты именно там, где надо, чтобы начать.",
    "Пусть сегодня всё будет не идеально — но твоё.",
    "Одна вещь за раз. Сегодня это твоя суперсила.",
    "Разреши себе день без подвигов.",
    "То, что тебя беспокоит, уже меньше, чем вчера.",
    "Улыбнись себе. Ты заслужил хотя бы одну улыбку.",
    "Сделай паузу. Это тоже действие.",
    "Ты справлялся и раньше. Сегодня — не исключение.",
    "Не сравнивай свой день с чужими сториз.",
    "Вода, шаги, сон. Всё остальное подождёт.",
    "Скажи «спасибо» хотя бы одному человеку.",
    "Сегодня можно быть добрее — к себе тоже.",
    "Ошибка — это не провал, это черновик.",
    "Загляни в окно. Мир крутится не только вокруг проблем.",
    "Пусть сегодня у тебя получится хоть что-то одно.",
    "Твоя энергия дорогая. Трать её сегодня на важное.",
    "Страх — просто сигнал, что ты растёшь.",
    "Сделай то, что откладывал 5 минут. Прямо сейчас.",
    "Ты не обязан быть в форме. Ты обязан быть собой.",
    "Один вдох. Один выдох. Всё, ты снова в игре.",
    "Позволь дню быть лёгким, даже если ты привычен к тяжёлым.",
    "Кто-то сегодня порадуется, что ты есть. Это факт.",
    "Меньше слов, больше шагов — но шаги маленькие.",
    "Сегодня день маленьких побед. Собирай их.",
    "Отпусти то, что нельзя контролировать. Это не твоё.",
    "Ты стал взрослее. Ты стал серьёзнее. И всё так же — в центре внимания.",
    "Улыбка тебе идёт. Проверено.",
    "Завтра будет новый день. И он тоже твой."
  ];
  // Настрой меняется каждый день по номеру дня года
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const day = Math.floor((now - start) / 86400000);
  document.getElementById('phrase').textContent = messages[day % messages.length];
  document.getElementById('date').textContent =
    now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
</script>
</body>
</html>

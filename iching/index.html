<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>И-Цзин: слово дня</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #fff;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #1e1e1e;
      border: 2px solid #ff8c00;
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 30px rgba(255, 140, 0, 0.2);
      transition: opacity 0.8s ease;
    }
    .card.fade { opacity: 0; }
    .hex {
      font-size: 36px;
      line-height: 1.5;
      margin-bottom: 20px;
      letter-spacing: 5px;
      color: #ff8c00;
    }
    .thought {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 20px;
      min-height: 80px;
    }
    .name {
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div class="hex" id="hex"></div>
    <div class="thought" id="thought"></div>
    <div class="name" id="name"></div>
  </div>

  <script>
    // Гексаграммы И-Цзин с классическими изречениями (краткая суть суждений)
    const hexagrams = [
      { name: "Цянь — Творчество", bits: "111111", text: "Свершение. Благоприятна стойкость." },
      { name: "Кунь — Исполнение", bits: "000000", text: "Свершение. Благоприятно быть стойким, как кобылица в дороге." },
      { name: "Чжунь — Начальная трудность", bits: "100010", text: "Вначале — трудность и хаос. Не выступай: время ещё не созрело." },
      { name: "Мэн — Недоразвитость", bits: "010001", text: "Не я стремлюсь к незрелым — незрелые стремятся ко мне." },
      { name: "Сюй — Ожидание", bits: "111010", text: "Обладай правдой и светом. Ожидание переправит через великую реку." },
      { name: "Сун — Суд", bits: "010111", text: "Даже в споре, где победишь, — остановись. Хулы не будет." },
      { name: "Ши — Войско", bits: "010000", text: "Порядок и зрелый человек — счастье, беды нет." },
      { name: "Би — Приближение", bits: "000010", text: "Приближение приносит счастье. Кто не устрашён — тот приближён." },
      { name: "Сяо Чу — Малое накопление", bits: "111011", text: "Плотные тучи, но дождя ещё нет. Накапливай тихо." },
      { name: "Ли — Поступь", bits: "110111", text: "Наступи на хвост тигра — он не укусит. Иди осторожно — и будет свершение." },
      { name: "Тай — Расцвет", bits: "111000", text: "Малое уходит, великое приходит. Счастье." },
      { name: "Пи — Упадок", bits: "000111", text: "Не всё зависит от тебя. Сохрани стойкость — и переждёшь." },
      { name: "Тун Жэнь — Единомышленники", bits: "101111", text: "Единомышленники в поле. Благоприятна переправа через великую реку." },
      { name: "Да Ю — Великое обладание", bits: "111101", text: "Великое обладание. Изначальное свершение." },
      { name: "Цянь — Смирение", bits: "001000", text: "Смирение — благоприятно. Благородный человек доводит дело до конца." },
      { name: "Юй — Вольность", bits: "000100", text: "Не затягивай с действием. Кто радуется вовремя — тот успевает." },
      { name: "Суй — Последование", bits: "100110", text: "Следуй за достойным — и будет свершение. Хулы не будет." },
      { name: "Гу — Испорченное", bits: "011001", text: "То, что испорчено, надо чинить. Исправление — к свершению." },
      { name: "Линь — Посещение", bits: "110000", text: "Твоё время приходит. Но радость не вечна — будь готов к смене." },
      { name: "Гуань — Созерцание", bits: "000011", text: "Смотри — и тебя видят. Созерцание полнее доверия." },
      { name: "Ши Хэ — Стиснутые зубы", bits: "100101", text: "Препятствие надо перегрызть. Твёрдость в правосудии — к свершению." },
      { name: "Би — Изящество", bits: "101001", text: "В малом — благоприятно иметь куда выступить. Красота подчиняет." },
      { name: "Бо — Разрушение", bits: "000001", text: "Старое отпадает. Сейчас неблагоприятно куда-то выступать." },
      { name: "Фу — Возврат", bits: "100000", text: "Возврат. В седьмой день всё вернётся. Двигайся — будет свершение." },
      { name: "У Ван — Беспорочность", bits: "100111", text: "Просто и честно — и будет свершение. Неправота принесёт беду." },
      { name: "Да Чу — Великое накопление", bits: "111001", text: "Великое накопление. Благоприятна переправа через великую реку." },
      { name: "И — Питание", bits: "100001", text: "Смотри, чем ты питаешься и кого питаешь. Стойкость — к счастью." },
      { name: "Да Го — Перевес", bits: "011110", text: "Опора прогибается, но крыша стоит. Действуй — будет свершение." },
      { name: "Кань — Опасность", bits: "010010", text: "Вода принимает форму берегов. Обладай правдой — и сердце будет успешно." },
      { name: "Ли — Сияние", bits: "101101", text: "Сияй, но будь мягок, как корова. Огонь требует бережности." },
      { name: "Сянь — Взаимодействие", bits: "001110", text: "Чувства взаимны и сильнее расчёта. Стойкость — к счастью." },
      { name: "Хэн — Постоянство", bits: "011100", text: "Постоянство. Маленькое, но каждый день — сильнее редкого подвига." },
      { name: "Дунь — Отступление", bits: "001111", text: "Отступление — к счастью. Умение уйти — тоже движение." },
      { name: "Да Чжуан — Великая мощь", bits: "111100", text: "Сила есть. Но благоприятна лишь стойкость — иначе сила обернётся." },
      { name: "Цзинь — Подъём", bits: "000101", text: "Подъём. Тебя заметят. Яркий свет дарует успех." },
      { name: "Мин И — Поражение света", bits: "101000", text: "Храни свет при себе. В трудностях стойкость — благоприятна." },
      { name: "Цзя Жэнь — Семья", bits: "101011", text: "Тепло начинается дома. Порядок в семье — порядок в делах." },
      { name: "Куй — Разлад", bits: "110101", text: "Противоположности порой дополняют друг друга. В малых делах — счастье." },
      { name: "Цзянь — Препятствие", bits: "001010", text: "Дорога закрыта? Обойди и встреться с великим человеком. Стойкость — к счастью." },
      { name: "Цзе — Разрешение", bits: "010100", text: "Груз отпущен. Благоприятный срок наступил — но возвращайся домой вовремя." },
      { name: "Сунь — Убыль", bits: "110001", text: "Убавь лишнее — и будешь счастлив. Меньше иногда даёт больше." },
      { name: "И — Приумножение", bits: "100011", text: "Приумножение. Благоприятно действовать и переправляться через великую реку." },
      { name: "Гуай — Выход", bits: "111110", text: "Настал час решительности. Говори твёрдо, но не насильствуй." },
      { name: "Гоу — Встреча", bits: "011111", text: "Нежданная встреча. Тьма сильна — не давай ей повелевать собой." },
      { name: "Цуй — Собрание", bits: "000110", text: "Люди собираются вокруг искренности. Явись к великому человеку." },
      { name: "Шэн — Восхождение", bits: "011000", text: "Дерево растёт медленно, но растёт. Иди навстречу великому — не бойся." },
      { name: "Кунь — Истощение", bits: "010110", text: "Истощение испытывает зрелого. Стойкость — к счастью, но слова сейчас не убедят." },
      { name: "Цзин — Колодец", bits: "011010", text: "Меняют город, но не меняют колодец. Источник внутри не иссякает." },
      { name: "Гэ — Смена", bits: "101110", text: "В день смены верят. Раскаяние исчезает — сними старую кожу." },
      { name: "Дин — Жертвенник", bits: "011101", text: "Жертвенник кормит. Займись тем, что питает душу." },
      { name: "Чжэнь — Гром", bits: "100100", text: "Раскат грома пугает — потом смеётся. Встряска — не катастрофа." },
      { name: "Гэнь — Сосредоточенность", bits: "001001", text: "Остановись. У кого нет намерений — у того покой." },
      { name: "Цзянь — Постепенность", bits: "001011", text: "Не пропускай ступеней. Постепенность надёжнее рывка." },
      { name: "Гуй Мэй — Выданная замуж", bits: "110100", text: "Прими свою роль с достоинством. Поспешное движение к великому не приведёт к успеху." },
      { name: "Фэн — Изобилье", bits: "101100", text: "Полдень. Пользуйся моментом — но помни, что солнце сменяется луной." },
      { name: "Люй — Странствие", bits: "001101", text: "Среди чужих скромность открывает двери. В странствии стойкость — к счастью." },
      { name: "Сюнь — Проникновение", bits: "011011", text: "Мягкий ветер меняет камни. Действуй тихо и настойчиво." },
      { name: "Дуй — Радость", bits: "110110", text: "Радость — это выбор. Она сверкает на воде и не тонет." },
      { name: "Хуань — Разведение", bits: "010011", text: "Лёд тает от тепла. Разреши себе растаять — и силы прильнут." },
      { name: "Цзе — Ограничение", bits: "110010", text: "Границы не убивают свободу, они её сохраняют. Но не будь жесток к себе." },
      { name: "Чжун Фу — Внутренняя правда", bits: "110011", text: "Внутренняя правда сильнее красивых слов. Даже свиньи и рыбы поддаются ей." },
      { name: "Сяо Го — Малый перевес", bits: "001100", text: "Сейчас лучше чуть-чуть перелететь, чем сильно перебрать. Малыми делами — можно." },
      { name: "Цзи Цзи — Уже конец", bits: "101010", text: "Дело сделано. Но за расцветом начинается спад — будь внимателен." },
      { name: "Вэй Цзи — Ещё не конец", bits: "010101", text: "Финал ещё не наступил. Осторожные последние шаги приносят счастье." }
    ];

    const card = document.getElementById('card');
    const hexBox = document.getElementById('hex');
    const thoughtEl = document.getElementById('thought');
    const nameEl = document.getElementById('name');

    function getDateNumber() {
      const t = new Date();
      const s = t.getFullYear().toString() +
                (t.getMonth() + 1).toString().padStart(2, '0') +
                t.getDate().toString().padStart(2, '0');
      return parseInt(s, 10);
    }

    function render() {
      const dailyHex = hexagrams[getDateNumber() % hexagrams.length];

      hexBox.innerHTML = '';
      for (const bit of dailyHex.bits) {
        const span = document.createElement('span');
        span.textContent = bit === '1' ? '⚊' : '⚋'; // ян — сплошная, инь — прерывистая
        hexBox.appendChild(span);
      }
      thoughtEl.textContent = '«' + dailyHex.text + '»';
      nameEl.textContent = dailyHex.name;
    }

    // Первая отрисовка сразу
    render();

    // Каждые 30 секунд проверяем: наступил ли новый день.
    // Если да — плавно меняем содержание без перезагрузки страницы.
    let lastDate = getDateNumber();
    setInterval(() => {
      const now = getDateNumber();
      if (now !== lastDate) {
        lastDate = now;
        card.classList.add('fade');
        setTimeout(() => {
          render();
          card.classList.remove('fade');
        }, 800);
      }
    }, 30000);
  </script>

</body>
</html>

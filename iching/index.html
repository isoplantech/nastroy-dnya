<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>И-Цзин: случайная гексаграмма</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f2e9;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #333;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 32px 40px;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .hex {
      font-size: 34px;
      line-height: 1.4;
      margin: 20px 0;
      letter-spacing: 8px;
    }
    .num { font-size: 14px; color: #888; margin-bottom: 6px; }
    .name { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    p { font-size: 16px; line-height: 1.6; margin: 0 0 18px; }
    .hint { font-size: 12px; color: #777; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="num" id="num"></div>
    <div class="name" id="name"></div>
    <div class="hex" id="hex"></div>
    <p id="text"></p>
    <div class="hint">Каждое открытие страницы — новая гексаграмма</div>
  </div>

  <script>
    const hexagrams = [
      { n: 1,  name: "Цянь — Творчество",          text: "Сильная энергия есть. Действуй, но без суеты.", bits: "111111" },
      { n: 2,  name: "Кунь — Исполнение",          text: "Иногда важнее слушать и быть восприимчивым, чем инициировать.", bits: "000000" },
      { n: 3,  name: "Чжунь — Начальная трудность", text: "В начале бывает хаос. Не бросай — именно сейчас всё формируется.", bits: "100010" },
      { n: 4,  name: "Мэн — Незрелость",           text: "Не стыдно не знать. Стыдно не спрашивать. Будь сейчас учеником.", bits: "010001" },
      { n: 5,  name: "Сюй — Ожидание",             text: "Пауза — тоже действие. Подожди, пока не прояснится картина.", bits: "111010" },
      { n: 6,  name: "Сун — Суд",                  text: "В споре редко побеждает кто-то один. Лучше смягчить позицию.", bits: "010111" },
      { n: 7,  name: "Ши — Войско",                text: "Работают порядок и план. Не действуй на эмоциях.", bits: "010000" },
      { n: 8,  name: "Би — Приближение",           text: "Хорошая компания ценнее быстрой победы. Держись тех, кому доверяешь.", bits: "000010" },
      { n: 9,  name: "Сяо Чу — Малое воспитание",  text: "Не пытайся сразу решить всё. Укрепляй то, что уже есть.", bits: "111011" },
      { n: 10, name: "Ли — Наступление",           text: "Идти вперёд можно — но осторожно, как по хвосту тигра.", bits: "110111" },
      { n: 11, name: "Тай — Расцвет",              text: "Сейчас всё складывается. Наслаждайся моментом.", bits: "111000" },
      { n: 12, name: "Пи — Упадок",                text: "Не всё зависит от тебя. Сохрани силы и подожди.", bits: "000111" },
      { n: 13, name: "Тун Жэнь — Единомышленники", text: "Найди своих. Вместе путь становится проще.", bits: "101111" },
      { n: 14, name: "Да Ю — Великое обладание",   text: "У тебя есть ресурсы. Используй их щедро, не жадничай.", bits: "111101" },
      { n: 15, name: "Цянь — Смирение",            text: "Тихая сила звучит громче громких слов.", bits: "001000" },
      { n: 16, name: "Юй — Вольность",             text: "Разреши себе немного лёгкости и радости без особой причины.", bits: "000100" },
      { n: 17, name: "Суй — Последование",         text: "Умей следовать за тем, кому доверяешь. Это не слабость.", bits: "100110" },
      { n: 18, name: "Гу — Исправление",           text: "Есть то, что давно пора починить. Сделай это — и станет легче.", bits: "011001" },
      { n: 19, name: "Линь — Посещение",           text: "Твоё время приближается. Готовься заранее.", bits: "110000" },
      { n: 20, name: "Гуань — Созерцание",         text: "Остановись и посмотри со стороны. Ответ виден тому, кто не спешит.", bits: "000011" },
      { n: 21, name: "Ши Хэ — Стиснутые зубы",     text: "Препятствие можно преодолеть. Настойчивость сейчас работает.", bits: "100101" },
      { n: 22, name: "Би — Изящество",             text: "Немного красоты в деталях меняет всё. Добавь её в день.", bits: "101001" },
      { n: 23, name: "Бо — Разрушение",            text: "Старое отпадает. Не жалей: на освободившемся месте появится новое.", bits: "000001" },
      { n: 24, name: "Фу — Возврат",               text: "Точка поворота. То, что казалось утраченным, может вернуться.", bits: "100000" },
      { n: 25, name: "У Ван — Беспорочность",      text: "Просто и честно — часто работает лучше хитростей.", bits: "100111" },
      { n: 26, name: "Да Чу — Великое накопление", text: "Собирай силу тихо. Большое дело начинается с кладовой.", bits: "111001" },
      { n: 27, name: "И — Питание",                text: "Следи за тем, чем питаешься: едой, словами, мыслями. Это формирует тебя.", bits: "100001" },
      { n: 28, name: "Да Го — Перевес",            text: "Нагрузка велика, но не смертельна. Не тащи всё в одиночку.", bits: "011110" },
      { n: 29, name: "Кань — Опасность",           text: "Вода принимает форму берегов. Прими обстоятельства — и пройди через них.", bits: "010010" },
      { n: 30, name: "Ли — Сияние",                text: "Огонь нужно беречь. Держи своё пламя аккуратно.", bits: "101101" },
      { n: 31, name: "Сянь — Взаимодействие",      text: "Чувства нередко важнее расчёта. Прислушайся к тому, что тянет.", bits: "001110" },
      { n: 32, name: "Хэн — Постоянство",          text: "Маленькое, но каждый день — сильнее редкого подвига.", bits: "011100" },
      { n: 33, name: "Дунь — Отступление",         text: "Умение вовремя отступить — это тоже движение вперёд.", bits: "001111" },
      { n: 34, name: "Да Чжуан — Великая мощь",    text: "Сила есть. Используй её по-честному, иначе она обернётся против тебя.", bits: "111100" },
      { n: 35, name: "Цзинь — Подъём",             text: "Тебя замечают. Расти спокойно — признание уже на пути.", bits: "000101" },
      { n: 36, name: "Мин И — Скрытый свет",       text: "Свет не обязательно должен гореть ярко. Храни его при себе.", bits: "101000" },
      { n: 37, name: "Цзя Жэнь — Семья",           text: "Тепло начинается дома. Уделить внимание близким — лучшая инвестиция.", bits: "101011" },
      { n: 38, name: "Куй — Разлад",               text: "Противоположности иногда дополняют друг друга. Не всё — конфликт.", bits: "110101" },
      { n: 39, name: "Цзянь — Препятствие",        text: "Дорога закрыта? Обойди. Это не тупик.", bits: "001010" },
      { n: 40, name: "Цзе — Освобождение",         text: "Груз можно отпустить. Прости, выдохни — и станет легче.", bits: "010100" },
      { n: 41, name: "Сунь — Убыль",               text: "Откажись от лишнего. Меньше иногда даёт больше.", bits: "110001" },
      { n: 42, name: "И — Приумножение",           text: "Делись — и это приумножится. Ветер и гром усиливают друг друга.", bits: "100011" },
      { n: 43, name: "Гуай — Прорыв",              text: "Настал момент сказать твёрдое «да» или твёрдое «нет». Половинчатость хуже.", bits: "111110" },
      { n: 44, name: "Гоу — Встреча",              text: "Нежданное случается. Прими спокойно, но не теряй себя.", bits: "011111" },
      { n: 45, name: "Цуй — Собрание",             text: "Люди тянутся к теплу. Будь тем, к кому хочется подойти.", bits: "000110" },
      { n: 46, name: "Шэн — Восхождение",          text: "Дерево растёт медленно. Твой подъём уже идёт.", bits: "011000" },
      { n: 47, name: "Кунь — Истощение",           text: "Тяжёлый этап. Но именно в нём видно, кто ты есть.", bits: "010110" },
      { n: 48, name: "Цзин — Колодец",             text: "Источник внутри не иссякает. Иди к нему.", bits: "011010" },
      { n: 49, name: "Гэ — Смена",                 text: "Старое можно сбросить. Сними «старую кожу» — и ты снова здесь.", bits: "101110" },
      { n: 50, name: "Дин — Жертвенник",           text: "Займись тем, что «кормит» душу. Это важное место.", bits: "011101" },
      { n: 51, name: "Чжэнь — Гром",               text: "Встряска — не катастрофа, а звонок: пора проснуться.", bits: "100100" },
      { n: 52, name: "Гэнь — Сосредоточенность",   text: "Остановиться — тоже действие. Просто послушай себя.", bits: "001001" },
      { n: 53, name: "Цзянь — Постепенность",      text: "Не пропускай ступени. Медленное развитие устойчивее рывка.", bits: "001011" },
      { n: 54, name: "Гуй Мэй — Союз",             text: "Прими свою роль с достоинством — и место найдётся.", bits: "110100" },
      { n: 55, name: "Фэн — Изобилие",             text: "Полдень. Пользуйся моментом, но помни: за пиком следует спад.", bits: "101100" },
      { n: 56, name: "Люй — Странствие",           text: "Среди чужих скромность открывает двери.", bits: "001101" },
      { n: 57, name: "Сюнь — Проникновение",        text: "Мягкий ветер меняет камни. Действуй тихо и настойчиво.", bits: "011011" },
      { n: 58, name: "Дуй — Радость",              text: "Радость — это выбор. Сделай его сегодня.", bits: "110110" },
      { n: 59, name: "Хуань — Развеивание",        text: "Лёд тает от тепла. Разреши себе растаять.", bits: "010011" },
      { n: 60, name: "Цзе — Ограничение",          text: "Границы не убивают свободу, они её сохраняют.", bits: "110010" },
      { n: 61, name: "Чжун Фу — Искренность",      text: "Внутренняя правда сильнее красивых слов. Будь честен с собой.", bits: "110011" },
      { n: 62, name: "Сяо Го — Малый перевес",     text: "Сейчас лучше «чуть-чуть перелететь», чем сильно перебрать.", bits: "001100" },
      { n: 63, name: "Цзи Цзи — Уже завершено",    text: "Дело сделано. Будь внимателен: за пиком начинается новый спуск.", bits: "101010" },
      { n: 64, name: "Вэй Цзи — Ещё не конец",     text: "Финал ещё не наступил. Осторожные последние шаги — то, что нужно.", bits: "010101" }
    ];

    const h = hexagrams[Math.floor(Math.random() * hexagrams.length)];
    document.getElementById('num').textContent = "№ " + h.n;
    document.getElementById('name').textContent = h.name;
    document.getElementById('text').textContent = h.text;

    const box = document.getElementById('hex');
    for (const c of h.bits) {
      const el = document.createElement('span');
      el.textContent = c === '1' ? '⚋' : '⚊';
      box.appendChild(el);
    }
  </script>
</body>
</html>

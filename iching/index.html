<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Слово дня</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #fff;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #1e1e1e;
      border: 2px solid #ff8c00;
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 30px rgba(255, 140, 0, 0.2);
    }
    .hex {
      font-size: 36px;
      line-height: 1.5;
      margin-bottom: 20px;
      letter-spacing: 5px;
      color: #ff8c00;
    }
    .thought {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 20px;
      min-height: 80px;
    }
    .name {
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="hex" id="hex"></div>
    <div class="thought" id="thought"></div>
    <div class="name" id="name"></div>
  </div>

  <script>
    const thoughts = [
      "Ветра нет, а жопа есть.",
      "Амплитуду уменьшай.",
      "У тебя всё есть.",
      "Вдох — позитив. Выдох — всё лишнее.",
      "Слёзы от ветра — это слёзы свободы.",
      "Камни прошлого остаются позади. Лети дальше.",
      "Даже на скорости можно быть в центре.",
      "Космос внутри, скорость снаружи.",
      "Алеф не в тишине. Алеф в движении.",
      "Не беги от проблем. Обгоняй их.",
      "Жопа есть, но она осталась на обочине.",
      "Гравитация любви держит на трассе.",
      "Настоящий кайф — когда рот открыт от восторга.",
      "Я не «жопа в мыле». Я — «ветер в волосах».",
      "Пусть летит всё лишнее. Оставляю главное.",
      "Красота у тебя внутри.",
      "Сканируй дальше.",
      "Тайна раскрыта.",
      "Ты в потоке.",
      "Не надейся на «вдруг». Делай."
    ];

    const hexagrams = [
      { name: "Цянь — Творчество", bits: "111111" },
      { name: "Кунь — Исполнение", bits: "000000" },
      { name: "Чжунь — Начальная трудность", bits: "100010" },
      { name: "Мэн — Незрелость", bits: "010001" },
      { name: "Сюй — Ожидание", bits: "111010" },
      { name: "Сун — Суд", bits: "010111" },
      { name: "Ши — Войско", bits: "010000" },
      { name: "Би — Приближение", bits: "000010" },
      { name: "Тай — Расцвет", bits: "111000" },
      { name: "Пи — Упадок", bits: "000111" },
      { name: "Тун Жэнь — Единомышленники", bits: "101111" },
      { name: "Да Ю — Великое обладание", bits: "111101" },
      { name: "Цянь — Смирение", bits: "001000" },
      { name: "Юй — Вольность", bits: "000100" },
      { name: "Суй — Последование", bits: "100110" },
      { name: "Гу — Исправление", bits: "011001" },
      { name: "Линь — Посещение", bits: "110000" },
      { name: "Гуань — Созерцание", bits: "000011" },
      { name: "Фу — Возврат", bits: "100000" },
      { name: "У Ван — Беспорочность", bits: "100111" },
      { name: "И — Питание", bits: "100001" },
      { name: "Кань — Опасность", bits: "010010" },
      { name: "Ли — Сияние", bits: "101101" },
      { name: "Сянь — Взаимодействие", bits: "001110" },
      { name: "Хэн — Постоянство", bits: "011100" },
      { name: "Дунь — Отступление", bits: "001111" },
      { name: "Да Чжуан — Великая мощь", bits: "111100" },
      { name: "Цзинь — Подъём", bits: "000101" },
      { name: "Цзя Жэнь — Семья", bits: "101011" },
      { name: "Цзе — Освобождение", bits: "010100" },
      { name: "Сунь — Убыль", bits: "110001" },
      { name: "И — Приумножение", bits: "100011" },
      { name: "Гуай — Прорыв", bits: "111110" },
      { name: "Гоу — Встреча", bits: "011111" },
      { name: "Цуй — Собрание", bits: "000110" },
      { name: "Шэн — Восхождение", bits: "011000" },
      { name: "Кунь — Истощение", bits: "010110" },
      { name: "Цзин — Колодец", bits: "011010" },
      { name: "Гэ — Смена", bits: "101110" },
      { name: "Чжэнь — Гром", bits: "100100" },
      { name: "Гэнь — Сосредоточенность", bits: "001001" },
      { name: "Цзянь — Постепенность", bits: "001011" },
      { name: "Фэн — Изобилие", bits: "101100" },
      { name: "Люй — Странствие", bits: "001101" },
      { name: "Дуй — Радость", bits: "110110" },
      { name: "Хуань — Развеивание", bits: "010011" },
      { name: "Цзе — Ограничение", bits: "110010" },
      { name: "Чжун Фу — Искренность", bits: "110011" },
      { name: "Цзи Цзи — Уже завершено", bits: "101010" },
      { name: "Вэй Цзи — Ещё не конец", bits: "010101" }
    ];

    // --- ЛОГИКА ВЫБОРА СЛОВА ДНЯ ---
    // Получаем сегодняшнюю дату в формате ГГГГММДД (например, 20261126)
    const today = new Date();
    const dateString = today.getFullYear().toString() + 
                       (today.getMonth() + 1).toString().padStart(2, '0') + 
                       today.getDate().toString().padStart(2, '0');

    // Превращаем дату в число (например, 20261126)
    const dateNumber = parseInt(dateString, 10);

    // Выбираем индекс на основе даты (остаток от деления)
    const thoughtIndex = dateNumber % thoughts.length;
    const hexIndex = dateNumber % hexagrams.length;

    const dailyThought = thoughts[thoughtIndex];
    const dailyHex = hexagrams[hexIndex];

    // Вывод на экран
    document.getElementById('thought').textContent = `"${dailyThought}"`;
    document.getElementById('name').textContent = dailyHex.name;

    const hexBox = document.getElementById('hex');
    for (const bit of dailyHex.bits) {
      const span = document.createElement('span');
      span.textContent = bit === '1' ? '⚋' : '⚊';
      hexBox.appendChild(span);
    }
  </script>

</body>
</html>

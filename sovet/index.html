<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Без обесценивания</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #fff;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #141414;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      transition: opacity 0.8s ease;
    }
    .card.fade { opacity: 0; }
    .thought {
      font-size: 22px;
      line-height: 1.5;
      font-weight: 500;
      margin-bottom: 30px;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hint {
      font-size: 12px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-top: 1px solid #222;
      padding-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div class="thought" id="thought"></div>
    <div class="hint">Советы тех, кто не был</div>
  </div>

  <script>
    const thoughts = [
      "Смерть ребёнка — «Соболезную» пишут в две строки, а живут с этим до конца.",
      "Смерть супруга — «Ты сильный, справишься» говорят те, кто вечером ужинает вдвоём.",
      "Неизлечимая болезнь — «Главное — позитивный настрой», советуют здоровые.",
      "Инвалидность — «Зато теперь ты ценишь жизнь», решают за тебя.",
      "Деменция — «Старикам свойственно забывать», пока не забудут твоё имя.",
      "Пытки — «Бывает хуже», говорит тот, у кого болит зуб.",
      "Изнасилование — «А что ты была за одежда?», спрашивают те, кто никогда не боялся темноты.",
      "Домашнее насилие — «Ну это же семья», кивают те, у кого дома тихо.",
      "Похищение — «Главное — не паниковать», советуют из безопасного кресла.",
      "Плен — «Там тоже люди», говорят те, кто не считал дни по потолку.",
      "Голод — «Просто купи крупу», советуют те, у кого есть карта.",
      "Бездомность — «Надо просто работать», решают те, кто ни разу не ночевал в подъезде.",
      "Предательство — «Всё к лучшему», утешают те, кого не предавали.",
      "Развод — «Зато свобода», говорят те, кто не делил детей по расписанию.",
      "Потеря сбережений — «Деньги — не главное», напоминают те, у кого они есть.",
      "Банкротство — «Это урок», кивают те, кто не считал звонки коллекторов.",
      "Увольнение — «Значит, было не твоё», решают те, кто не стоял в очереди на бирже.",
      "Провал дела жизни — «Попробуй ещё раз», советуют те, кто не сжёг мосты.",
      "Клевета — «Не обращай внимания», говорят те, чьё имя не полоскали.",
      "Тюрьма за чужое — «Система разберётся», верят те, кто не сидел.",
      "Потеря родины — «Везде можно жить», говорят те, кто не просыпался в чужом языке.",
      "Война — «Главное — верить в победу», решают те, кто не хоронил соседей.",
      "Стихийное бедствие — «Вещи наживём», утешают те, кто не стоял на пепелище.",
      "Пожар — «Главное — все живы», говорят те, кто не считал сгоревшие годы.",
      "Смерть питомца — «Это же всего лишь собака», решают те, кто не знал, кто ждал у двери.",
      "Одиночество в старости — «Зато никто не мешает», шутят те, к кому звонят.",
      "Бесплодие — «Можно взять из детдома», советуют те, кто не считал циклы.",
      "Измена — «Все так живут», кивают те, кому не разбивали доверие.",
      "Зависимость — «Просто возьми себя в руки», говорят те, кто не знал ломки.",
      "Суицид близкого — «Почему не сказал?», спрашивают те, кто не слышал тишины после.",
      "Потеря данных — «Это же просто железка», говорят те, кто не терял всё за один день.",
      "Хроническая усталость — «Соберись», советуют те, кто спит по восемь часов.",
      "Хватит давать советы тем, чью боль вы не держали в руках. Просто скажите: «Я рядом». Или молчите."
    ];

    const card = document.getElementById('card');
    const thoughtEl = document.getElementById('thought');

    function render() {
      const now = new Date();
      const dayOfYear = Math.floor(
        (now - new Date(now.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24
      );
      thoughtEl.textContent = thoughts[dayOfYear % thoughts.length];
    }

    render();

    // Проверяем смену дня каждые 30 секунд — в полночь текст сменится сам
    let lastDay = new Date().getDate();
    setInterval(() => {
      const now = new Date();
      if (now.getDate() !== lastDay) {
        lastDay = now.getDate();
        card.classList.add('fade');
        setTimeout(() => {
          render();
          card.classList.remove('fade');
        }, 800);
      }
    }, 30000);
  </script>

</body>
</html>
